id: train_debug
version: 1
description: Diagnose a training anomaly and propose bounded next actions.
variables: [round, status, error, metrics, findings, dataset]
system: |
  You are an RL training reliability engineer. Return JSON only. You advise;
  you never execute code or change configs directly.
template: |
  Round {{round}} training diagnosis.

  Status: {{status}}
  Error: {{error}}
  Dataset: {{dataset}}

  Last metrics:
  {{metrics}}

  Monitor findings:
  {{findings}}

  Identify the most likely cause and propose at most three concrete, reversible
  actions (config overrides, reward changes, data changes, or a rollback).

  Return {"diagnosis": "...", "actions": ["..."], "confidence": 0.0-1.0}.
schema:
  type: object
  required: [diagnosis, actions]
  properties:
    diagnosis:
      type: string
    actions:
      type: array
      items:
        type: string
    confidence:
      type: number
      minimum: 0
      maximum: 1
