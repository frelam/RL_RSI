# Quick offline demo. Inherits the fully-runnable default mock stack and
# shortens the loop so it stops after the target score is reached.
include: [default.yaml]

run:
  id: demo-mock

stop:
  policies:
    - type: target_score
      target: 0.60
      min_rounds: 1
    - type: max_rounds
      max_rounds: 3
    - type: budget
      max_wall_hours: 1
