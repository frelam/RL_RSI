# Real-backend starter: vLLM serving, verl training, real benchmarks and
# OpenAI-compatible judges. The component tree validates without a GPU:
#   rsi validate --config configs/real.yaml
#   rsi run --config configs/real.yaml --model /path/to/checkpoint --task reasoning --dry-run
#
# First real run (reasoning):
#   1. Materialize the full datasets listed under configs/tasks.yaml `reasoning`
#      (the examples/datasets rows are small placeholders).
#   2. rsi run --config configs/real.yaml --model /path/to/hf-checkpoint --task reasoning --round 2
#
# The loop serves the base checkpoint, trains a candidate, exports it to HF,
# benchmarks it, promotes it, and redeploys the endpoint.
include: [default.yaml]

checkpoint:
  initial:
    # Override with --model on the command line; the default keeps validate offline.
    model_path: "mock://base-model"

infer:
  type: vllm
  base_url: http://127.0.0.1:8000/v1
  model: policy
  follow_checkpoints: true
  launch:
    enabled: true
    port: 8000
    startup_timeout_s: 1800
    # Pin serving to dedicated devices and leave train.release_inference false,
    # or keep the default and let the loop stop vLLM before training.
    # env:
    #   CUDA_VISIBLE_DEVICES: "0"
    command: [python, -m, vllm.entrypoints.openai.api_server,
              --model, "{model_path}", --served-model-name, "{model}",
              --port, "{port}", --trust-remote-code]

collect:
  benchmark:
    names: [math, code_debugging]
    # The task preset targets more abilities than these two files measure. Add
    # EvalScope entries below (requires the `evalscope` package) for the rest;
    # unmeasured targets are carried to the next round instead of blocking promotion.

benchmark:
  benchmarks:
    math:
      type: jsonl
      path: examples/benchmark_math.jsonl
      pass_threshold: 0.5
    code_debugging:
      type: jsonl
      path: examples/benchmark_code_debugging.jsonl
      pass_threshold: 0.5
    # Example EvalScope entry. The command must write results.json with a
    # {"results": {<metric>: <score>}} mapping; capability_map maps metrics to
    # catalog abilities.
    # bfcl_v3:
    #   type: evalscope
    #   command: [evalscope, eval, --model, "{model}", --api-url, "{base_url}",
    #             --datasets, bfcl_v3, --output-dir, "{output_dir}"]
    #   capability_map: {bfcl_v3: agentic.single_turn_tool_call}
    #   pass_threshold: 0.5

data:
  build:
    # verl reads parquet. JSONL copies stay next to the parquet files for replay
    # and audit. `verl_parquet` implies the verl_jsonl row schema.
    type: verl_parquet
    schema: verl_jsonl
    format: parquet
    val_ratio: 0.05
    val_min: 1
    val_max: 64

train:
  # vLLM and the trainer share GPUs on a single node; stop the server first.
  # It restarts automatically for validation.
  release_inference: true

trainer:
  type: verl
  # verl overrides use `key=value` tokens. Add the algorithm/rollout settings
  # your recipe needs (advantage estimator, rollout n, batch sizes, ...).
  command: [torchrun, --nproc_per_node, "8", -m, verl.trainer.main_ppo,
            "data.train_files={train_path}",
            "data.val_files={val_path}",
            "actor_rollout_ref.model.path={model_path}",
            "trainer.default_local_dir={output_dir}",
            "trainer.nnodes=1",
            "trainer.n_gpus_per_node=8",
            "reward.custom_reward_function.path={reward_function}",
            "reward.custom_reward_function.name=compute_score"]
  # One reward bridge scores every mixed capability from extra_info.verifier:
  # built-in rule scorers plus the reasoning_rl / agentic_rl adapters.
  reward_function: src/rsi/rewards/verl_bridge.py
  output_dir: "{work_dir}/checkpoint"
  # verl writes global_step_* directories; pick the latest, then merge the
  # sharded checkpoint into a Hugging Face directory that vLLM can serve.
  checkpoint_glob: "global_step_*"
  export:
    command: [python, -m, verl.model_merger, merge, --backend, fsdp,
              --local_dir, "{checkpoint_path}", --target_dir, "{export_dir}"]
    output_dir: "{work_dir}/hf"
    timeout_s: 3600
  # Monitoring expects JSONL records {"step": .., "metrics": {..}}. verl does
  # not write this file by default; add a callback that appends to this path.
  # Without it the loop still validates on benchmarks, but metric monitors idle.
  metrics_path: "{work_dir}/metrics.jsonl"
  poll_interval_s: 10
  timeout_s: 86400
  gpu_count: 8

llm:
  default_profile: generator
  profiles:
    generator:
      type: openai
      base_url: "${ENV:RSI_LLM_BASE_URL:http://127.0.0.1:8001/v1}"
      model: "${ENV:RSI_LLM_MODEL:generator-model}"
      api_key_env: OPENAI_API_KEY
      json_mode: true
    judge:
      type: openai
      base_url: "${ENV:RSI_JUDGE_BASE_URL:http://127.0.0.1:8001/v1}"
      model: "${ENV:RSI_JUDGE_MODEL:judge-model}"
      api_key_env: OPENAI_API_KEY
      json_mode: true
