# Capability catalog: the shared vocabulary for benchmarks, analysis and data.
# Add entries to make planning/reward selection more precise. Unknown
# capabilities fall back to the defaults below.

defaults:
  kind: text
  priority: 0.5
  reward:
    type: rule
    name: contains
    weight: 1.0
  verifier:
    type: rule
    name: contains
  seeds: []

capabilities:
  math.reasoning:
    description: multi-step quantitative reasoning and verification
    kind: text
    priority: 1.0
    seeds: [algebra, geometry, word problems, arithmetic verification]
    reward: {type: rule, name: numeric, weight: 1.0}
    verifier: {type: rule, name: numeric, tolerance: 0.001}
    benchmark:
      - benchmark: demo
        match: "math"

  code.debugging:
    description: locate and repair defects in code from symptoms or tests
    kind: text
    priority: 0.9
    seeds: [python traceback, logic bug, edge case, failing unit test]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
    benchmark:
      - benchmark: demo
        match: "code"

  # verl reasoning_rl abilities. `reasoning_rl` delegates to the verl
  # src/rsi/rewards/reasoning/compute_score.py reward, routing on the data_source prefix.
  code.problem_solving:
    description: write a program that passes all hidden test cases for an algorithmic problem
    kind: text
    priority: 0.9
    seeds: [stdin/stdout program, function implementation, algorithmic puzzle, edge-case handling]
    reward: {type: rule, name: reasoning_rl, weight: 1.0}
    verifier: {type: rule, name: reasoning_rl}

  logic.reasoning:
    description: solve rule-based puzzles and constraint problems with an exactly checkable answer
    kind: text
    priority: 0.8
    seeds: [grid puzzle, symbolic deduction, arithmetic puzzle, path planning]
    reward: {type: rule, name: reasoning_rl, weight: 1.0}
    verifier: {type: rule, name: reasoning_rl}

  stem.reasoning:
    description: multi-step quantitative reasoning on science and engineering questions
    kind: text
    priority: 0.7
    seeds: [physics, chemistry, biology, statistics]
    reward: {type: rule, name: reasoning_rl, weight: 1.0}
    verifier: {type: rule, name: reasoning_rl}

  instruction.following:
    description: satisfy multiple explicit formatting and content constraints
    kind: text
    priority: 0.7
    seeds: [format constraints, multi-constraint answers, structured output]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
    benchmark:
      - benchmark: demo
        match: "instruction"

  long_context.retrieval:
    description: retrieve and combine evidence across long or multi-document contexts
    kind: text
    priority: 0.8
    seeds: [needle in a haystack, multi-document QA, distractor passages, multi-hop retrieval]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
    benchmark:
      - benchmark: demo
        match: "long_context"

  # ---- Capabilities added for the EvalScope benchmarks. The benchmark -> capabilities
  # mapping lives in configs/benchmarks.yaml; the names below are the vocabulary it uses.

  # Knowledge and language understanding.
  knowledge.qa:
    description: "recall facts and answer general world-knowledge questions"
    kind: knowledge
    priority: 0.8
    seeds: [trivia, exam questions, multi-subject MCQ, short factual answer]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  knowledge.expert:
    description: "deliver expert-level professional work in finance, medicine, industry, law and science"
    kind: knowledge
    priority: 0.6
    seeds: [financial analysis, medical case, legal memo, industrial report, scientific review]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  knowledge.medical:
    description: "answer clinical, biomedical and health questions"
    kind: knowledge
    priority: 0.5
    seeds: [clinical MCQ, biomedical literature QA, health advice, radiology]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  knowledge.law:
    description: "answer legal questions and apply legal rules"
    kind: knowledge
    priority: 0.5
    seeds: [statute lookup, legal exam, case analysis, regulatory compliance]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  knowledge.multilingual:
    description: "answer knowledge questions written in languages other than English and Chinese"
    kind: knowledge
    priority: 0.5
    seeds: [multilingual exam questions, regional knowledge, indic languages, bahasa]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  chinese.understanding:
    description: "understand and answer Chinese-language questions"
    kind: text
    priority: 0.7
    seeds: [中文考试, 中文知识问答, 中文阅读理解, 中文数学题]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  multilingual.understanding:
    description: "understand and answer in languages other than English and Chinese"
    kind: text
    priority: 0.6
    seeds: [indic languages, bahasa, hindi, spanish, portuguese, french]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  multilingual.translation:
    description: "translate text between languages while keeping meaning, terminology and register"
    kind: text
    priority: 0.5
    seeds: [document translation, terminology, low-resource language pair, formal register]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  reading.comprehension:
    description: "answer questions from a passage, table or document by combining what it states"
    kind: text
    priority: 0.7
    seeds: [passage QA, yes/no reading check, table QA, evidence span selection]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  commonsense.reasoning:
    description: "apply everyday physical, social and situational common sense"
    kind: text
    priority: 0.7
    seeds: [plausible continuation, coreference, social situation, physical affordance]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  math.process_verification:
    description: "review a step-by-step math solution and locate the first wrong step"
    kind: text
    priority: 0.7
    seeds: [error step detection, critique a proof, check arithmetic in a worked solution]
    reward: {type: rule, name: numeric, weight: 1.0}
    verifier: {type: rule, name: numeric, tolerance: 0.001}
  judgement.decision:
    description: "make a typed judgement call: pick a named option, rate on an ordered scale or choose the better response"
    kind: text
    priority: 0.6
    seeds: [preference pair, ordinal rating, rule-based choice, yes probability]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  emotion.understanding:
    description: "recognise emotional states and subtle emotional cues in dialogue"
    kind: text
    priority: 0.5
    seeds: [emotion intensity rating, empathic reading of a conversation, mixed feelings]
    reward: {type: rule, name: numeric, weight: 1.0}
    verifier: {type: rule, name: numeric, tolerance: 0.001}
  language.pragmatics:
    description: "read implied meaning: humour, irony, paradoxical or pragmatic subtext"
    kind: text
    priority: 0.4
    seeds: [irony detection, satire, meaningful nonsense, implied intent]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  nlp.ner:
    description: "extract and label named entities in text"
    kind: text
    priority: 0.5
    seeds: [biomedical entities, finance entities, nested entities, low-resource domain]
    reward: {type: rule, name: regex, weight: 1.0}
    verifier: {type: rule, name: regex}
  nlp.classification:
    description: "label a text with an intent, stance or category"
    kind: text
    priority: 0.5
    seeds: [intent classification, topic labelling, yes/no classification]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  nlp.extraction:
    description: "extract structured fields, events, relations and trigger words from text"
    kind: text
    priority: 0.5
    seeds: [event detection, relation extraction, trigger word, structured slot filling]
    reward: {type: rule, name: regex, weight: 1.0}
    verifier: {type: rule, name: regex}
  summarization:
    description: "summarise a document faithfully and concisely without adding unsupported claims"
    kind: text
    priority: 0.5
    seeds: [news summary, long report digest, public-opinion summary]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}

  # Instruction following and conversation.
  instruction.open_ended:
    description: "give a helpful, well-organised answer to an open-ended request, judged by preference"
    kind: text
    priority: 0.8
    seeds: [open question, everyday request, arena-style prompt, advice]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  instruction.prompt_writing:
    description: "write prompts for other models and assign roles to them"
    kind: text
    priority: 0.5
    seeds: [prompt rewriting, role assignment, agent instructions]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  conversation.multi_turn:
    description: "stay coherent and keep earlier constraints across several conversation turns"
    kind: text
    priority: 0.8
    seeds: [follow-up question, changing constraints, multi-turn instructions]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  long_context.memory:
    description: "recall facts and preferences from an earlier long conversation or history"
    kind: text
    priority: 0.7
    seeds: [session recall, user preference memory, multi-session QA]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}

  # Truthfulness and safety.
  truthfulness.factuality:
    description: "give factually correct answers and avoid common misconceptions and hallucination"
    kind: text
    priority: 0.8
    seeds: [misconception, hallucinated claim detection, unanswerable question]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  truthfulness.honesty:
    description: "stay consistent with own beliefs under pressure instead of lying"
    kind: text
    priority: 0.7
    seeds: [pressure to fabricate, doubling down, disinformation request]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  safety.refusal:
    description: "refuse harmful requests, including ones embedded in a long or harmless-looking context"
    kind: text
    priority: 0.8
    seeds: [harmful request, implicit harm in long context, unsafe advice]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  safety.over_refusal:
    description: "answer benign requests that merely look sensitive instead of refusing them"
    kind: text
    priority: 0.6
    seeds: [sensitive-looking safe prompt, edge-case request, mistaken refusal]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}
  safety.monitoring:
    description: "detect hidden malicious behaviour in agent transcripts"
    kind: text
    priority: 0.5
    seeds: [covert tool misuse, exfiltration, benign transcript]
    reward: {type: rule, name: numeric, weight: 1.0}
    verifier: {type: rule, name: numeric, tolerance: 0.001}

  # More code abilities, by what the task demands.
  code.practical:
    description: "use diverse libraries and their docs to complete a practical, instruction-rich task"
    kind: text
    priority: 0.9
    seeds: [library call with documentation, heterogeneous APIs, complex instruction]
    reward: {type: rule, name: reasoning_rl, weight: 1.0}
    verifier: {type: rule, name: reasoning_rl}
  code.data_science:
    description: "complete data-science code with pandas, numpy, scipy and similar libraries"
    kind: text
    priority: 0.7
    seeds: [dataframe manipulation, numerical routine, plotting, sklearn]
    reward: {type: rule, name: reasoning_rl, weight: 1.0}
    verifier: {type: rule, name: reasoning_rl}
  code.scientific:
    description: "write scientific computing code for physics, chemistry, biology and materials"
    kind: text
    priority: 0.7
    seeds: [physics simulation, chemistry computation, biology model, numerical solver]
    reward: {type: rule, name: reasoning_rl, weight: 1.0}
    verifier: {type: rule, name: reasoning_rl}
  code.multi_language:
    description: "solve the same programming problem across many programming languages"
    kind: text
    priority: 0.6
    seeds: [rust, go, java, javascript, swift]
    reward: {type: rule, name: reasoning_rl, weight: 1.0}
    verifier: {type: rule, name: reasoning_rl}
  code.sql:
    description: "write a SQL query that answers a question over a database schema"
    kind: text
    priority: 0.8
    seeds: [multi-table join, aggregation, subquery, schema-grounded query]
    reward: {type: rule, name: reasoning_rl, weight: 1.0}
    verifier: {type: rule, name: reasoning_rl}

  # Non-text modalities. No rule scorer applies; keep the catalog defaults.
  multimodal.grounding:
    description: "link a referring expression to a region of an image"
    kind: text
    priority: 0.4
    seeds: [referring expression, region grounding]
  speech.synthesis:
    description: "convert text to speech with correct content and speaker similarity"
    kind: text
    priority: 0.4
    seeds: [text to speech, speaker similarity]
  knowledge.cybersecurity:
    description: "apply offensive and defensive security knowledge: cryptography, forensics, exploitation, reverse engineering"
    kind: knowledge
    priority: 0.4
    seeds: [ctf challenge, log forensics, binary exploitation, web vulnerability]
    reward: {type: rule, name: contains, weight: 1.0}
    verifier: {type: rule, name: contains}

  # ---- Agent abilities measured by the EvalScope agent benchmarks in
  # configs/benchmarks.yaml. They sit under `agent.` because `agentic.*` is kept
  # equal to the capabilities that verl-toolRL datasets cover (see
  # tests/test_verl_agentic_rl.py). No dataset backs them yet, so they keep the
  # catalog defaults for reward and verifier.
  agent.prompt_injection_resistance:
    description: "ignore instructions injected through tool results or web pages and keep following the user's task"
    kind: agentic
    priority: 0.8
    seeds: [injected instruction in tool output, poisoned web page, indirect prompt injection]
  agent.harmful_task_refusal:
    description: "refuse a task that needs tools and would cause harm"
    kind: agentic
    priority: 0.8
    seeds: [harmful request with tools, harmful task under user pressure]
  agent.benign_task_completion:
    description: "still complete a benign task that resembles a harmful one"
    kind: agentic
    priority: 0.6
    seeds: [benign look-alike of a harmful task, dual-use request]
  agent.policy_grounded_service:
    description: "serve a simulated user over several turns under a domain policy: ask for missing information and call the APIs"
    kind: agentic
    priority: 0.8
    seeds: [airline booking, retail exchange, telecom plan change, banking policy]
  agent.gui_operation:
    description: "operate a web page or desktop interface through clicks and typing"
    kind: agentic
    priority: 0.6
    seeds: [form filling, web navigation, UI element selection]
  agent.terminal_task:
    description: "solve a task in a terminal or OS environment: run commands, inspect files, produce artifacts"
    kind: agentic
    priority: 0.8
    seeds: [shell task, environment setup, system administration, capture the flag]
  agent.codebase_navigation:
    description: "explore a real repository with shell and search tools to find and read the relevant code"
    kind: agentic
    priority: 0.7
    seeds: [codebase question answering, locate the code for an issue, repo evidence gathering]
  agent.workplace_task:
    description: "complete an expert-level workplace task with tools and write the deliverable files"
    kind: agentic
    priority: 0.7
    seeds: [research report, office deliverable, expert workflow, agent skills]

  # Tool-use agents, split by what each dataset focuses on. Sources in `seeds`
  # are the source names of verl-toolRL `agentic_rl_data`, mapped per row in
  # src/rsi/adapters/verl_agentic_rl.py. The `agentic_rl` scorer delegates to
  # the built-in rewards in src/rsi/rewards/agentic/.
  agentic.single_turn_tool_call:
    description: "单轮工具调用: read the tool schemas and pick the right tool and arguments in one shot"
    kind: agentic
    priority: 0.9
    seeds: [procedural_st, apigen, toolace, sealtools, apibank]
    reward: {type: rule, name: agentic_rl, weight: 1.0}
    verifier: {type: rule, name: agentic_rl}
  agentic.multi_turn_stateful_tool_use:
    description: "多轮工具调用（有状态）: track state changed by earlier turns and reach the goal over several steps"
    kind: agentic
    priority: 0.9
    seeds: [procedural_mt, apigen_mt, toucan, funreason_mt, toolmind]
    reward: {type: rule, name: agentic_rl, weight: 1.0}
    verifier: {type: rule, name: agentic_rl}
  agentic.interleaved_user_turns:
    description: "交错多用户轮: a new user message arrives before the current turn is finished; keep earlier constraints while handling it"
    kind: agentic
    priority: 0.9
    seeds: [interleaved_mt]
    reward: {type: rule, name: agentic_rl, weight: 1.0}
    verifier: {type: rule, name: agentic_rl}
  agentic.clarify_when_under_specified:
    description: "信息不足时拒答/澄清: when a key slot is missing, the goal is unreachable or no tool fits, ask instead of calling blindly"
    kind: agentic
    priority: 0.9
    seeds: [stateful_abstain, when2call]
    reward: {type: rule, name: agentic_rl, weight: 1.0}
    verifier: {type: rule, name: agentic_rl}
  agentic.tool_irrelevance:
    description: "无关请求不调用工具: answer a request that needs no tool without calling one"
    kind: agentic
    priority: 0.9
    seeds: [hammer]
    reward: {type: rule, name: agentic_rl, weight: 1.0}
    verifier: {type: rule, name: agentic_rl}
  agentic.parallel_tool_calls:
    description: "同轮并行调用: issue independent calls together in one turn instead of one by one"
    kind: agentic
    priority: 0.9
    seeds: [parallel_mt]
    reward: {type: rule, name: agentic_rl, weight: 1.0}
    verifier: {type: rule, name: agentic_rl}
  agentic.multi_domain_state_ops:
    description: "多领域状态操作: modify and verify state in vehicle, travel, trading, microblog, messaging and ticketing"
    kind: agentic
    priority: 0.9
    seeds: [vehicle_travel_mt, social_ops_mt]
    reward: {type: rule, name: agentic_rl, weight: 1.0}
    verifier: {type: rule, name: agentic_rl}
  agentic.search_qa:
    description: "搜索问答: search over several turns, then answer"
    kind: agentic
    priority: 0.9
    seeds: [search_r1, asearcher, a2search]
    reward: {type: rule, name: agentic_rl, weight: 1.0}
    verifier: {type: rule, name: agentic_rl}
  agentic.math_code_reasoning:
    # simplerl_math3_5 is listed in the package docs but has no loader there.
    description: "带代码推理的数学: compute with code, then give the answer"
    kind: agentic
    priority: 0.9
    seeds: [reasoning_math, retool]
    reward: {type: rule, name: agentic_rl, weight: 1.0}
    verifier: {type: rule, name: agentic_rl}
  agentic.code_from_tests:
    description: "按测试写代码: pass stdin/stdout test cases, using the execution result to fix the code"
    kind: agentic
    priority: 0.9
    seeds: [code_exec]
    reward: {type: rule, name: agentic_rl, weight: 1.0}
    verifier: {type: rule, name: agentic_rl}
