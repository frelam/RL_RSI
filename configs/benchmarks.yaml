# Benchmark registry: one entry per EvalScope benchmark, keyed by its EvalScope
# dataset name. Source lists:
# https://evalscope.readthedocs.io/zh-cn/latest/get_started/supported_dataset/llm.html
# https://evalscope.readthedocs.io/zh-cn/latest/get_started/supported_dataset/agent.html
# Each entry has
#   title          display name
#   categories     EvalScope task tags
#   capabilities   capabilities from configs/capabilities.yaml that the benchmark covers
#   subsets        optional. A subset (a `subset_list` value) covers `capabilities`
#                  unless it is listed here; list only the subsets that differ. A key
#                  may name several subsets separated by commas when they cover the
#                  same capabilities (write such keys without quotes).
# Subsets that differ from each other only in difficulty or topic but not in
# capability are not listed.
# The benchmark name plus subset name is the sub-capability of every capability it covers.
# `general_*` and `data_collection` wrap user-supplied datasets: `general_*` keep
# their fixed answer format, `data_collection` has no fixed content and starts empty.
benchmarks:
  aa_lcr: {title: "AA-LCR", categories: [Knowledge, LongContext, Reasoning], capabilities: [knowledge.qa, long_context.retrieval]}
  agieval:
    title: "AGIEval"
    categories: [Knowledge, MCQ, Math, Reasoning]
    capabilities: [knowledge.qa, math.reasoning, logic.reasoning, reading.comprehension]
    subsets:
      aqua-rat, sat-math, gaokao-mathqa, math, gaokao-mathcloze: [math.reasoning]
      lsat-ar, logiqa-en: [logic.reasoning]
      logiqa-zh: [logic.reasoning, chinese.understanding]
      lsat-lr: [logic.reasoning, reading.comprehension]
      lsat-rc, sat-en, gaokao-english: [reading.comprehension]
      sat-en-without-passage: [knowledge.qa]
      gaokao-chinese: [chinese.understanding]
      gaokao-geography, gaokao-history: [chinese.understanding, knowledge.qa]
      gaokao-biology, gaokao-chemistry, gaokao-physics: [chinese.understanding, stem.reasoning]
      jec-qa-kd, jec-qa-ca: [chinese.understanding, knowledge.law]
  aime24: {title: "AIME-2024", categories: [Math, Reasoning], capabilities: [math.reasoning]}
  aime25: {title: "AIME-2025", categories: [Math, Reasoning], capabilities: [math.reasoning]}
