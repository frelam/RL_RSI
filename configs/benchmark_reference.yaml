# Reference scores for the `missing_capability` analyzer: the score of an average
# open-weight model on one EvalScope benchmark, by parameter count in billions.
#
# Each point is [mean, std] over the models of that size class (population std).
# The analyzer interpolates linearly between neighbouring sizes and clamps
# outside the table. A `benchmark.subset` key (e.g. `arc.ARC-Easy`) is the curve
# of that subset.
#
# Population: instruction-tuned models except the Gemma 3 1B-12B rows of the
# general tables and the two entries marked "base models only" above their key.
# Scores are self-reported by each publisher, so settings differ per benchmark;
# read the note above a key before relying on its std. Only whole-benchmark
# curves were published for most models, so subsets are sparse.
#
# Sources (fetched 2026-11-27):
#   Qwen2.5 LLM blog          https://qwenlm.github.io/blog/qwen2.5-llm/
#   Llama 3.1 / 3.2 / 3.3     https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct
#                             https://huggingface.co/meta-llama/Llama-3.2-3B-Instruct
#                             https://huggingface.co/meta-llama/Llama-3.2-1B-Instruct
#                             https://huggingface.co/meta-llama/Llama-3.3-70B-Instruct
#   Gemma 2 / Gemma 3         https://huggingface.co/google/gemma-2-9b-it
#                             https://huggingface.co/google/gemma-3-27b-it
#   Phi-3-mini / Phi-4        https://huggingface.co/microsoft/Phi-3-mini-4k-instruct
#                             https://huggingface.co/microsoft/phi-4
#   Mistral Small 3.1         https://huggingface.co/mistralai/Mistral-Small-3.1-24B-Instruct-2503
#   GLM-4-9B-Chat             https://huggingface.co/THUDM/glm-4-9b-chat
#   InternLM2.5-20B-Chat      https://huggingface.co/internlm/internlm2_5-20b-chat
