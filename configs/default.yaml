# RL-RSI default configuration.
#
# Everything here is intentionally runnable offline with deterministic mocks:
#   PYTHONPATH=src python -m rsi run --config configs/default.yaml --run-id demo
#
# Replace adapters (infer / trainer / benchmark / harness / llm profiles) to
# connect real vLLM, verl, EvalScope, and agent harnesses. Keys are grouped so
# every knob has a stable dotted path, e.g. analyze.merge.min_confidence=0.3.

run:
  id: ""                 # empty => timestamped id
  seed: 7

paths:
  runs_dir: runs
  repo_root: ""          # optional; inferred from the config/include location

prompts:
  dir: prompts

skills:
  dir: skills

capabilities:
  path: configs/capabilities.yaml

loop:
  type: classic
  on_stage_error: abort     # abort | skip
  max_stage_retries: 1
  overwrite: false

checkpoint:
  initial:
    model_path: "mock://base-model"
    base_model: "mock-base"
    # params_b: 7              # model size in billions, read by the missing_capability analyzer
  keep_all: true

# --------------------------------------------------------------------- inference
infer:
  type: mock
  answer_template: "MOCK[{{checkpoint}}] {{index}}"
  # Real vLLM example:
  # type: vllm
  # base_url: http://127.0.0.1:8000/v1
  # model: policy
  # follow_checkpoints: true
  # launch:
  #   enabled: true
  #   port: 8000
  #   startup_timeout_s: 900
  #   command: [python, -m, vllm.entrypoints.openai.api_server,
  #             --model, "{model_path}", --served-model-name, "{model}",
  #             --port, "{port}"]

# --------------------------------------------------------------------- collection
collect:
  save_items: true
  save_trajectories: true
  benchmark:
    enabled: true
    names: [demo]
  rollout:
    enabled: true
    prompts_path: examples/rollout_prompts.jsonl
    limit: 4
    samples_per_prompt: 1
    temperature: 0.7
    max_tokens: 512

benchmark:
  primary_metric: mean_score
  benchmarks:
    demo:
      type: mock
      items_per_capability: 8
      pass_threshold: 0.5
      max_gain_versions: 4
      noise: 0.004
      subcapabilities: [core, advanced]
      capabilities:
        math.reasoning:
          base: 0.42
          gain: 0.10
        code.debugging:
          base: 0.30
          gain: 0.14
        instruction.following:
          base: 0.72
          gain: 0.03
        long_context.retrieval:
          base: 0.25
          gain: 0.02

# --------------------------------------------------------------------- analysis
analyze:
  require_defects: false
  methods:
    - type: rule
      name: rule
      baseline: global          # global | previous | absolute
      margin: 0.08
      min_gap: 0.02
      min_items: 2
      min_severity: 0.05
      include_subcapabilities: false
    - type: llm_judge
      name: judge
      prompt: badcase_analysis
      profile: judge
      votes: 1
      vote_policy: majority
      min_vote_ratio: 0.5
      top_n: 6
      max_score: 0.75
      min_confidence: 0.2
    # Enable when collected rollout trajectories contain task context worth auditing.
    # - type: trajectory_agent
    #   name: trajectory_agent
    #   prompt: trajectory_ability_analysis
    #   profile: judge
    #   max_trajectories: 12
    # Enable to infer missing capabilities: capabilities of benchmarks that score
    # close to the same-size average (configs/benchmark_reference.yaml) are marked,
    # and every unmarked catalog capability becomes a defect.
    # - type: missing_capability
    #   name: missing
    #   registry: configs/benchmarks.yaml
    #   reference: configs/benchmark_reference.yaml
    #   margin: 0.05              # good if score >= reference - max(margin, sigma * std)
    #   sigma: 0.0               # widen the tolerance by this many reference std
    #   unreferenced: skip        # skip | absolute (judge by absolute_threshold)
    #   severity: 0.6             # scaled by the catalog priority of each capability
    # Optional agentic deep-dive (advisory, schema-gated):
    # - type: harness
    #   name: harness
    #   prompt: badcase_deepdive
    #   harness: analysis
    #   skills: [badcase-deepdive]
    #   top_n: 4
  merge:
    weights:
      rule: 1.0
      llm_judge: 1.1
      harness: 1.0
    default_weight: 1.0
    min_severity: 0.05
    min_confidence: 0.2
    max_defects: 32

# --------------------------------------------------------------------- data
data:
  enabled: true
  save_intermediate: false
  max_generated: 256
  # Reuse prior train.jsonl rows only. Validation rows are never replayed.
  replay:
    enabled: true
    fraction: 0.2
    recent_rounds: 1
    max_samples: 128
    strategy: target          # uniform | target (allocate replay by the target distribution)
  default_collector: text
  plan:
    strategy: rule              # rule | llm
    count_per_defect: 4
    min_count: 2
    max_count: 6
    max_requests: 8
    # Target capability scope of this run: defects outside it are dropped before planning.
    # The benchmarks should cover every capability listed here. Empty => no restriction.
    scope: []
    min_severity: 0.05
    target_difficulty: [0.2, 0.9]
    prompt: data_plan
    profile: generator
    curriculum:
      type: severity            # severity | fixed | prerequisite
      max_capabilities: 3
      # type: fixed
      # order: [math.reasoning, code.debugging, long_context.retrieval]
      # unlock_per_round: 1
      # type: prerequisite
      # score_floor: 0.6
      # prerequisites:
      #   long_context.retrieval: [instruction.following]
    # Mock target-distribution pre-processing: merged analyzer priorities plus
    # pending capabilities, then a convex blend with the previous round's target.
    target_distribution:
      enabled: true
      previous_weight: 0.3      # in [0, 1); 0 disables the previous-round blend
      pending_priority: 0.25    # floor for capabilities carried over by validation
  collectors:
    text:
      type: text_synthesis
      prompt: data_text_synthesis
      profile: generator
      samples_per_call: 2
      temperature: 0.9
      max_tokens: 1024
      max_calls: 4
    agentic:
      type: agentic_synthesis
      prompt: env_synthesis
      harness: synth
      skills: [env-synthesis]
      max_tasks: 4
      timeout_s: 900
    dataset:
      type: dataset_library
      catalog: configs/datasets.yaml
      max_datasets: 4
    rollout:
      type: rollout_reuse
      only_success: true
      min_reward: 0.0
      include_unlabeled: true
    knowledge:
      type: knowledge_ingest
      paths: [examples/knowledge]
      prompt: knowledge_qa
      profile: generator
      chunk_chars: 2000
      max_chunks: 4
      extensions: [".md", ".txt"]
  filter:
    pipeline:
      - type: format
        require_response: true
        reject_identical: true
      - type: pii
        action: drop
      - type: length
        min_prompt_chars: 8
        max_prompt_chars: 12000
        max_response_chars: 16000
      - type: judge_quality
        prompt: sample_quality
        profile: judge
        min_score: 0.5
        on_error: keep
      - type: dedup
        cross_round: true
        ngram: 3
        threshold: 0.98
      - type: verifier
        min_score: 0.99
        require_reference: false
      - type: pattern
        patterns:
          - "(?i)as an ai language model"
      # Optional policy rollouts filter verifiable prompts by task difficulty.
      - type: adaptive_rollout
        enabled: false
        samples: [4, 8, 16]
        temperature: 0.7
        max_tokens: 1024
        extend_all_wrong_to_32: true
        on_error: keep
  difficulty:
    type: composite
    graders:
      - type: rule
        weight: 0.45
      - type: pass_rate
        weight: 0.35
        blend_rule: 0.2
      - type: rollout
        weight: 0.2
        samples: [4, 8, 16]
        probe_missing: false
  mixing:
    type: capability_weighted
    floor: 0.2
    priority_bonus: 0.5
    target_total: 0             # 0 => no total cap
    target_band: [0.05, 0.95]
    enforce_band: true
    min_per_group: 1
    max_per_group: 0
    shuffle: true
    preserve_ratio: true
    ratio_tolerance: 0.10      # absolute share error per group, in [0, 1]
    relax_by: 0.15             # widen both ends of the difficulty band per step
    relax_max_steps: 1         # 0 => strict difficulty band only
    # type: history_bandit
    # explore_rounds: 2
    # candidates:
    #   - {code.debugging: 1.0, long_context.retrieval: 1.0}
    #   - {code.debugging: 2.0, long_context.retrieval: 1.0}
  build:
    type: jsonl
    schema: prompt_response      # prompt_response | messages | verl_jsonl
    val_ratio: 0.15
    val_min: 1
    val_max: 16
    include_metadata: true
    reward:
      default: {type: rule, name: contains, weight: 1.0}
      by_capability: {}

# --------------------------------------------------------------------- training
train:
  monitor:
    stop_on_critical: true
    algorithms:
      - type: nan_guard
      - type: grad_spike
        threshold: 10.0
        ratio: 5.0
      - type: entropy_collapse
        threshold: 0.15
        critical_threshold: 0.05
        patience: 3
      - type: reward_hacking
        patience: 5
      - type: plateau
        patience: 6
        min_delta: 0.01
      - type: saturation
        threshold: 0.95
      - type: response_length_spike
        window: 5
        growth: 1.5
      - type: training_scale
        window: 8
        reward_floor: 0.7
        log_perplexity_ceiling: 1.0
        lr_scaling: sqrt
  supervisor:
    enabled: true
    max_retries: 1
    retrain_on_critical: true
    retrain_on_failure: true
    discard_on_critical: false
  feedback:
    max_replans: 1
    high_pass_rate: 0.95
    difficulty_step: 0.1
    max_difficulty_shift: 0.2
    reward_hacking_weight_multiplier: 1.5
    max_reward_multiplier: 3.0
  debug_agent:
    enabled: false
    prompt: train_debug
    harness: debug
    skills: [train-debug]
    timeout_s: 900

trainer:
  type: mock
  steps: 30
  eval_every: 6
  val_base: 0.45
  val_gain: 0.06
  entropy_start: 1.25
  entropy_decay: 0.008
  noise: 0.008
  gpu_hours_per_step: 0.001
  inject: {}
  # Real verl example (metrics file must be JSONL: {"step":..,"metrics":{..}}):
  # type: verl
  # command: [torchrun, --nproc_per_node, "8", -m, verl.trainer.main_ppo,
  #           --data.train_files, "{train_path}", --data.val_files, "{val_path}",
  #           --actor_rollout_ref.model.path, "{model_path}",
  #           --trainer.default_local_dir, "{output_dir}"]
  # output_dir: "{work_dir}/checkpoint"
  # metrics_path: "{work_dir}/metrics.jsonl"
  # Map backend-specific names to canonical RSI names. Example:
  # metric_aliases: {val_score: [validation/score, eval/reward], log_perplexity: [actor/log_perplexity]}
  # poll_interval_s: 10
  # timeout_s: 86400
  # gpu_count: 8

validate:
  mode: auto                   # auto | benchmark | metrics
  metric: mean_score
  min_delta: 0.0
  target_min_delta: 0.0
  max_other_regression: 0.01
  allow_regression: false
  force_benchmark: false
  benchmark:
    names: []                  # empty => reuse collect.benchmark.names

# Optional OPD command adapter. Its entry point receives the previous
# checkpoint as {model_path} and the validated teacher as {teacher_model_path}.
# The OPD artifact is benchmark-checked against that teacher before promotion.
opd:
  enabled: false
  trainer:
    type: command
    command: [python, path/to/opd_entrypoint.py,
              --base-model, "{model_path}",
              --teacher-model, "{teacher_model_path}",
              --train-data, "{train_path}",
              --output-dir, "{output_dir}"]
    output_dir: "{work_dir}/checkpoint"
    metrics_path: "{work_dir}/metrics.jsonl"
    timeout_s: 86400

# --------------------------------------------------------------------- stopping
stop:
  combine: any
  policies:
    - type: max_rounds
      max_rounds: 4
    - type: target_score
      target: 0.62
      min_rounds: 1
    - type: plateau
      patience: 2
      min_delta: 0.003
    - type: budget
      max_wall_hours: 4
      max_gpu_hours: 0
    # - type: manual
    #   file: STOP

# --------------------------------------------------------------------- LLMs
# Profiles are shared by judges, data generators and planners.
llm:
  default_profile: generator
  profiles:
    generator:
      type: mock
      model: mock-generator
      fixtures:
        data_text_synthesis:
          samples:
            - prompt: >-
                [{{request_id}} r{{round}} v{{call_index}} A] {{capability}}
                practice task about {{seed_topic}}: design a concrete problem,
                solve it, and state the final answer.
              response: >-
                Step 1: restate the problem and its constraints. Step 2: choose a
                method and apply it. Step 3: verify the result. Final answer:
                synthetic-{{request_id}}-{{call_index}}-A.
              reference: null
            - prompt: >-
                [{{request_id}} r{{round}} v{{call_index}} B] A harder
                {{capability}} exercise on {{seed_topic}} with an edge case and
                a self-check requirement.
              response: >-
                First, enumerate edge cases. Then reason step by step and verify
                both the main path and the edge case. Final answer:
                synthetic-{{request_id}}-{{call_index}}-B.
              reference: null
        data_plan:
          requests:
            - capability: code.debugging
              kind: text
              count: 4
              target_difficulty: [0.3, 0.8]
              seeds: [debugging, traceback, edge case]
            - capability: long_context.retrieval
              kind: text
              count: 4
              target_difficulty: [0.3, 0.85]
              seeds: [needle in a haystack, multi-document QA]
        knowledge_qa:
          samples:
            - prompt: >-
                Based on the provided context, answer: what does the note say
                about the RSI loop? Reference the source.
              response: >-
                The note says the loop is code-driven and that harnesses are
                bounded tools; see the cited source for the exact wording.
        sample_difficulty:
          difficulty: 0.55
          reason: multi-step and requires verification
    judge:
      type: mock
      model: mock-judge
      fixtures:
        badcase_analysis:
          defects:
            - capability: long_context.retrieval
              severity: 0.55
              confidence: 0.8
              description: >-
                The model fails to retrieve facts that require combining several
                distant passages, and often settles on a plausible near-miss.
              evidence:
                - "worst case: multi-passage retrieval scored 0.0-0.25"
              suggested_data:
                kind: text
                seeds: [needle in a haystack, multi-document QA, distractor passages]
                target_difficulty: [0.35, 0.8]
        sample_quality:
          score: 0.88
          keep: true
          reason: specific, self-contained, verifiable
        data_plan:
          requests:
            - capability: code.debugging
              kind: text
              count: 4
              seeds: [debugging, traceback]
            - capability: long_context.retrieval
              kind: text
              count: 4
              seeds: [multi-document QA]
        train_debug:
          diagnosis: metric anomaly likely caused by reward scale
          actions: [reduce learning rate, audit reward]
    # Real OpenAI-compatible judge profile:
    # type: openai
    # base_url: http://127.0.0.1:8001/v1
    # model: judge-model
    # api_key_env: OPENAI_API_KEY
    # json_mode: true

# --------------------------------------------------------------------- harnesses
harness:
  synth:
    type: mock
    fixtures:
      env_synthesis:
        tasks:
          - name: "debug-{{request_id}}-{{round}}"
            instruction: >-
              Debug the failing function in this workspace, explain the root
              cause, and make the tests pass.
            files:
              main.py: |
                def add(a, b):
                    return a - b
              test_main.py: |
                from main import add
                assert add(2, 3) == 5
            verifier: {type: harness, name: tests_pass}
            difficulty: 0.55
          - name: "retrieval-{{request_id}}-{{round}}"
            instruction: >-
              Answer the question using only the provided multi-document
              context, citing the passages you used.
            files:
              context.md: |
                Passage A: the cache is disabled.
                Passage B: the cache is enabled only in staging.
            verifier: {type: rule, name: contains}
            difficulty: 0.7
  analysis:
    type: mock
    fixtures:
      badcase_deepdive:
        defects:
          - capability: long_context.retrieval
            severity: 0.6
            confidence: 0.7
            description: retrieval failures concentrate on multi-hop evidence
            suggested_data:
              kind: text
              seeds: [multi-hop retrieval, distractor documents]
  debug:
    type: mock
    fixtures:
      train_debug:
        diagnosis: entropy collapsed while reward kept rising
        actions: [increase entropy coefficient, inspect reward scale, rerun]
  # Real command harness example:
  # synth:
  #   type: command
  #   command: [python, path/to/agent_harness.py, --task, "{task_file}",
  #             --out, "{output_file}", --skills, "{skills_dir}"]
  #   timeout_s: 1800
