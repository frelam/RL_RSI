# Dataset registry: one entry per dataset, open-source or self-defined. Each entry has
#   name          the key
#   url           where the raw data is downloaded from (empty for generated data)
#   path          the local rows, already preprocessed
#   abilities     capability -> how well the dataset covers it (0 to 1)
#   reward        {type, name, weight}; `name` is the scorer that scores a response
#   reward_code   where that reward is implemented (`path::function`)
#   preprocess    {pipeline: script(s) that turn the download into `path`, steps: load-time steps}
# Optional: license, priority (0 to 1, how ready the local rows are), source (keep only
# the rows of this dataset when `path` mixes several), config and split (huggingface
# loader). Remote sources should be pinned and license-reviewed.
#
# Entries with local rows are active. A file-backed entry without `path` (nothing
# downloaded yet) is declared only and is skipped when datasets are selected.
# verl-style rows (verl `examples/reasoning_rl`, verl-toolRL `agentic_rl_data`) are
# mapped to the capabilities by src/rsi/adapters/verl_*.py when loaded; their
# rewards are the built-ins under src/rsi/rewards/. Each active
# verl-style `path` holds one example row and has priority 0.3: 8 rows come from the
# verl datasets, 13 were built with the package's own loaders and generators, and the
# math_bigmath and logic_reasoning_gym rows are hand-written (gated repo, missing package).
datasets:
  math_word_problems:
    loader: jsonl
    path: examples/datasets/math_word_problems.jsonl
    priority: 0.8
    abilities: {math.reasoning: 1.0}
    reward: {type: rule, name: numeric, weight: 1.0}
    reward_code: src/rsi/core/scoring.py::score_text (numeric)
    license: synthetic
    preprocess:
      pipeline: hand-written rows
      steps: [normalize_chat, strip_text, drop_empty]

  code_debugging:
    loader: jsonl
    path: examples/datasets/code_debugging.jsonl
    priority: 0.7
    abilities: {code.debugging: 1.0}
    reward: {type: rule, name: contains, weight: 1.0}
    reward_code: src/rsi/core/scoring.py::score_text (contains)
    license: synthetic
    preprocess:
      pipeline: hand-written rows
      steps: [normalize_chat, strip_text, drop_empty]

  # ---- verl `examples/reasoning_rl` (math, code, logic, stem, instruction following) ----
  # Rewards: src/rsi/rewards/reasoning/compute_score.py routes on the data_source
  # prefix (built in, no verl checkout needed). The pool a
  # pipeline script writes mixes datasets (data_source math_*, ...), so `source`
  # keeps this dataset's rows.
  math_dapo:
    url: https://huggingface.co/datasets/BytedTsinghua-SIA/DAPO-Math-17k
    license: unverified
    path: examples/datasets/math_dapo.jsonl
    priority: 0.3
    abilities: {math.reasoning: 0.9}
    source: math_dapo
    reward: {type: rule, name: reasoning_rl, weight: 1.0}
    reward_code: src/rsi/rewards/reasoning/compute_score.py::compute_score  # math_: math_verify, then math_dapo
    preprocess:
      pipeline: examples/reasoning_rl/scripts/to_parquet_math.py  # HF -> verl parquet (train, config default)
      steps: []

